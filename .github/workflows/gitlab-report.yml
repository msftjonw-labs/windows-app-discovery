name: GitLab public-project report

on:
  workflow_dispatch:
    inputs:
      limit:
        description: GitLab cohort size (1-100)
        default: "100"
        required: true
      project_budget:
        description: Maximum recent public projects examined (up to 1000)
        default: "500"
        required: true
      email:
        description: Send the separate GitLab PDF to the configured report recipient
        type: boolean
        default: false
  schedule:
    - cron: "0 10 * * 1"
      timezone: "America/Los_Angeles"

permissions:
  contents: read

concurrency:
  group: gitlab-public-report
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check GitLab.com DNS and public API
        run: |
          Resolve-DnsName gitlab.com -ErrorAction Stop
          $response = Invoke-WebRequest -Uri "https://gitlab.com/api/v4/projects?visibility=public&per_page=1" -TimeoutSec 60
          Write-Host "GitLab public API HTTP status: $($response.StatusCode)"
      - name: Discover and analyze public GitLab.com projects
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          COHORT_LIMIT: ${{ inputs.limit || '100' }}
          PROJECT_BUDGET: ${{ inputs.project_budget || '500' }}
        run: python -m discovery.gitlab --install-inspector --limit $env:COHORT_LIMIT --project-budget $env:PROJECT_BUDGET
      - name: Render GitLab Markdown and charts
        run: python -m discovery.report_markdown --input gitlab-reports/latest.json --output gitlab-reports
      - name: Render GitLab PDF
        run: python -m discovery.report_pdf --input gitlab-reports/latest.json --output gitlab-reports/report.pdf --archive-dir gitlab-report-history
      - name: Keep GitLab reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-report
          path: |
            gitlab-reports
            gitlab-report-history
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: collect
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: gitlab-report
      - name: Commit isolated GitLab reports and PDF history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- gitlab-reports gitlab-report-history
          if ! git diff --cached --quiet; then
            git commit -m "Publish GitLab public-project report"
            git push
          fi

  email:
    needs: collect
    if: (github.event_name == 'workflow_dispatch' && inputs.email) || (github.event_name == 'schedule' && vars.GITLAB_EMAIL_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: gitlab-report
      - name: Send GitLab PDF
        env:
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ vars.REPORT_RECIPIENT }}
        run: python -m discovery.send_email --report gitlab-reports/latest.json --pdf gitlab-reports/report.pdf
