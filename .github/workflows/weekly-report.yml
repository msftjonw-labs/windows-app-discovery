name: Weekly report — collect, publish reports, email PDF

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Random sample size (1-100)
        default: "100"
        required: true
      discovery:
        description: Discovery method
        type: choice
        options: [auto, gharchive, graphql-search]
        default: auto
      email:
        description: Email the PDF report
        type: boolean
        default: true
      pages:
        description: Also deploy the interactive GitHub Pages dashboard
        type: boolean
        default: true
      rerun_report_run_id:
        description: Optional previous Actions run ID; reuse its weekly-report cohort instead of rediscovering
        required: false
        default: ""
  schedule:
    # Every Monday 09:00 Pacific time (PST in winter, PDT in summer).
    - cron: "0 9 * * 1"
      timezone: "America/Los_Angeles"

permissions:
  contents: read
  actions: read

concurrency:
  group: repository-pilot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Dashboard tests
        run: node --test tests/frontend.test.cjs
      - name: Restore analysis cache
        uses: actions/cache@v4
        with:
          path: .cache/analysis
          key: pilot-${{ runner.os }}-${{ hashFiles('discovery/**') }}-${{ github.run_id }}
          restore-keys: |
            pilot-${{ runner.os }}-${{ hashFiles('discovery/**') }}-
      - name: Install pinned Microsoft Application Inspector
        if: ${{ !inputs.rerun_report_run_id }}
        run: |
          python -c "from discovery.pilot import install_inspector, ROOT; print(install_inspector(ROOT / '.tools' / 'inspector'))"
      - name: Inspector integration tests
        if: ${{ !inputs.rerun_report_run_id }}
        run: |
          $env:INSPECTOR_PATH = (Get-ChildItem .tools\inspector -Filter ApplicationInspector.CLI.exe -Recurse | Select-Object -First 1).FullName
          python -m unittest tests.test_inspector -v
      - name: Discover (GH Archive random sample) and analyze
        if: ${{ !inputs.rerun_report_run_id }}
        env:
          GH_TOKEN: ${{ secrets.DISCOVERY_TOKEN || github.token }}
          PILOT_LIMIT: ${{ inputs.limit || '100' }}
          PILOT_DISCOVERY: ${{ inputs.discovery || 'auto' }}
        run: python -m discovery.pilot --limit $env:PILOT_LIMIT --discovery $env:PILOT_DISCOVERY --confidence 0.95
      - name: Restore pinned cohort from a previous run
        if: ${{ inputs.rerun_report_run_id }}
        uses: actions/download-artifact@v4
        with:
          name: weekly-report
          path: rerun-report
          run-id: ${{ inputs.rerun_report_run_id }}
          github-token: ${{ github.token }}
      - name: Reuse the collected report without stale PDF output
        if: ${{ inputs.rerun_report_run_id }}
        run: |
          python -c "from pathlib import Path; import shutil; p = Path('site/data/latest.json'); p.parent.mkdir(parents=True, exist_ok=True); shutil.copyfile('rerun-report/data/latest.json', p)"
      - name: Analyze Windows candidate purpose and community feedback
        if: ${{ !inputs.rerun_report_run_id }}
        env:
          GH_TOKEN: ${{ secrets.DISCOVERY_TOKEN || github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
        run: python -m discovery.analysis
      - name: Review cross-OS application support for the full sample
        env:
          GH_TOKEN: ${{ secrets.DISCOVERY_TOKEN || github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
        run: python -m discovery.cross_os --assessments-output reports/cross-os-assessments.json
      - name: Render repository report
        run: python -m discovery.report_markdown
      - name: Keep repository report
        uses: actions/upload-artifact@v4
        with:
          name: repository-report
          path: reports
          if-no-files-found: error
          retention-days: 90
      - name: Render PDF report
        env:
          PAGES_URL: ${{ ((github.event_name == 'schedule' && vars.ENABLE_PAGES != 'false') || (github.event_name == 'workflow_dispatch' && inputs.pages)) && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
        run: python -m discovery.report_pdf --output site/report.pdf --archive-dir new-report-history
      - name: Keep archived PDF report
        uses: actions/upload-artifact@v4
        with:
          name: report-history
          path: new-report-history/report-*.pdf
          if-no-files-found: error
          retention-days: 90
      - name: Keep report and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            site/data/latest.json
            site/report.pdf
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        if: (github.event_name == 'schedule' && vars.ENABLE_PAGES != 'false') || (github.event_name == 'workflow_dispatch' && inputs.pages)
        with:
          path: site

  publish:
    needs: collect
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: repository-report
          path: reports
      - uses: actions/download-artifact@v4
        with:
          name: report-history
          path: report-history
      - name: Commit latest repository report and archived PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/README.md reports/platforms.svg reports/languages.svg reports/frameworks.svg reports/project_types.svg reports/application_types.svg reports/components.svg reports/candidate_components.svg reports/cross-os-assessments.json report-history/report-*.pdf
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "Publish latest weekly discovery report and archive PDF"
            git push
          fi

  deploy:
    needs: collect
    if: (github.event_name == 'schedule' && vars.ENABLE_PAGES != 'false') || (github.event_name == 'workflow_dispatch' && inputs.pages)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  email:
    needs: [collect, deploy]
    if: always() && needs.collect.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') && (github.event_name == 'schedule' || inputs.email)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: weekly-report
          path: site
      - name: Send PDF to Gmail
        env:
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ vars.REPORT_RECIPIENT }}
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: python -m discovery.send_email --report site/data/latest.json --pdf site/report.pdf
