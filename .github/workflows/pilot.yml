name: Collect pilot and publish Pages

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum selected repositories (1-100)
        default: "100"
        required: true
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: repository-pilot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Dashboard tests
        run: node --test tests/frontend.test.cjs
      - name: Restore analysis cache
        uses: actions/cache@v4
        with:
          path: .cache/analysis
          key: pilot-${{ runner.os }}-${{ hashFiles('discovery/**') }}-${{ github.run_id }}
          restore-keys: |
            pilot-${{ runner.os }}-${{ hashFiles('discovery/**') }}-
      - name: Install pinned Microsoft Application Inspector
        run: |
          python -c "from discovery.pilot import install_inspector, ROOT; print(install_inspector(ROOT / '.tools' / 'inspector'))"
      - name: Inspector integration tests
        run: |
          $env:INSPECTOR_PATH = (Get-ChildItem .tools\inspector -Filter ApplicationInspector.CLI.exe -Recurse | Select-Object -First 1).FullName
          python -m unittest tests.test_inspector -v
      - name: Discover and analyze
        env:
          GH_TOKEN: ${{ secrets.DISCOVERY_TOKEN || github.token }}
          PILOT_LIMIT: ${{ inputs.limit || '100' }}
        run: python -m discovery.pilot --limit $env:PILOT_LIMIT
      - name: Keep diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-report
          path: site/data/latest.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
