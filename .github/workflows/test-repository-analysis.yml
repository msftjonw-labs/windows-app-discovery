name: Temporary repository Analysis retest

on:
  push:
    branches: [test/repository-analysis]
    paths: [.github/workflows/test-repository-analysis.yml]

permissions:
  contents: read
  actions: read

jobs:
  retest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run analysis regression tests
        run: python -m unittest tests.test_analysis -v
      - name: Download the previously scanned test cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39855095876 --repo $env:GITHUB_REPOSITORY --name weekly-report --dir test-report
      - name: Retest OpenAI summaries for the same Windows candidates
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o
        run: |
          $reports = @(Get-ChildItem test-report -Recurse -Filter latest.json)
          if ($reports.Count -ne 1) { throw "Expected exactly one collected report" }
          python -m discovery.analysis --report $reports[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,pathlib; p=next(pathlib.Path('test-report').rglob('latest.json')); r=json.loads(p.read_text(encoding='utf-8')); c=[v for v in r['repositories'] if v['status']=='success' and 'Windows' in v.get('platforms',[])]; print(json.dumps([{'repository':v['name'],'analysis':v.get('analysis',{}).get('status'),'error':v.get('analysis',{}).get('error')} for v in c],indent=2)); assert len(c)==7; assert all(v.get('analysis',{}).get('status')=='success' for v in c)"
      - name: Keep verified analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-retest
          path: test-report/**/latest.json
          if-no-files-found: error
          retention-days: 7
