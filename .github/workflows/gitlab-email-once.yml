name: Email previous GitLab PDF once

on:
  push:
    branches: [feature/gitlab-discovery]
    paths: [.github/workflows/gitlab-email-once.yml]

permissions:
  contents: read
  actions: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore PDF and metadata from the last successful GitLab run
        uses: actions/download-artifact@v4
        with:
          name: gitlab-report
          run-id: 41784741514
          github-token: ${{ github.token }}
      - name: Send the existing GitLab PDF
        env:
          GMAIL_ADDRESS: ${{ vars.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ vars.REPORT_RECIPIENT }}
        run: python -m discovery.send_email --report gitlab-reports/latest.json --pdf gitlab-reports/report.pdf
